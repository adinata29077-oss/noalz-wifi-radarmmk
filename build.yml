name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Susun struktur proyek
        run: |
          mkdir -p app/src/main/java/com/noalz/wifiradar app/src/main/assets app/src/main/res/values app/src/main/res/drawable
          cp app-build.gradle.kts app/build.gradle.kts
          cp AndroidManifest.xml app/src/main/
          cp MainActivity.kt app/src/main/java/com/noalz/wifiradar/
          cp index.html app/src/main/assets/
          cp themes.xml app/src/main/res/values/
          cp ic_launcher.xml app/src/main/res/drawable/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Ringkasan error
        if: failure()
        run: |
          echo '## Penyebab error' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E -B2 -A12 'What went wrong|^e: |error:' build.log | head -60 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: NoalzWifiRadar-debug-apk
          path: app/build/outputs/apk/debug/*.apk
